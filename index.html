<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycloak Access Proof</title>
<meta name="description" content="A minimal protected app used to verify Greenlight's reviewed Keycloak deployment path.">
<link rel="stylesheet" href="design-system/tokens.css">
<link rel="stylesheet" href="design-system/components.css">
<script src="design-system/components.js" defer></script>
<script src="vendor/pocketbase.umd.js"></script>
<script src="pb-auth.js"></script>
<style>
[hidden] { display: none !important; }
.stage { max-width: 48rem; margin: 0 auto; padding: var(--space-6); }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="brand-mark"></span><span>Keycloak Access Proof</span></a>
  <div style="margin-left:auto"></div>
  <span class="badge" id="who" hidden></span>
  <button class="btn btn--ghost" id="sign-in" hidden>Sign in</button>
  <button class="btn btn--ghost" id="sign-out" hidden>Sign out</button>
</header>
<main class="stage">
  <div class="card card--pad">
    <span class="badge badge--success">Sign-in required</span>
    <h1>Protected access is active</h1>
    <p>This proof app is available only through the central Keycloak grant gate.</p>
  </div>
</main>
<script>
const who = document.getElementById('who');
const signIn = document.getElementById('sign-in');
const signOut = document.getElementById('sign-out');
PBAuth.mode().then((mode) => {
  if (mode !== 'keycloak') throw new Error('expected keycloak access');
  PBAuth.onChange((user) => {
    signIn.hidden = !!user;
    signOut.hidden = !user;
    who.hidden = !user;
    if (user) who.textContent = user.name || user.email;
  });
});
signIn.addEventListener('click', () => PBAuth.signIn());
signOut.addEventListener('click', () => PBAuth.signOut());
</script>
</body>
</html>
